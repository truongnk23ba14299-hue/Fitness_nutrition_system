
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>FitLife - Google Token</title>
</head>
<body>

    <h2>FitLife - Get Google ID Token</h2>

    <div id="googleButton"></div>

    <h3>Google ID Token:</h3>

    <textarea id="token"
              rows="12"
              cols="100"
              placeholder="Token sẽ xuất hiện ở đây">
    </textarea>

    <script>
        function initGoogle() {
            google.accounts.id.initialize({
                client_id: "388351289264-dtvilh14iksvbvb6p2gor6pp84isnbcr.apps.googleusercontent.com",

                callback: function(response) {
                    document.getElementById("token").value =
                        response.credential;
                }
            });

            google.accounts.id.renderButton(
                document.getElementById("googleButton"),
                {
                    theme: "outline",
                    size: "large",
                    text: "signin_with"
                }
            );
        }
    </script>

    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer
        onload="initGoogle()">
    </script>

</body>
</html>
