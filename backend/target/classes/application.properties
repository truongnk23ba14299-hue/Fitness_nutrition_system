# Cấu hình Server
server.port=8080
spring.application.name=fitness-nutrition-system

# Kết nối cơ sở dữ liệu PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/fitness_nutrition_db
spring.datasource.username=postgres
spring.datasource.password=mitto12345@
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cấu hình JWT (JSON Web Token)
# Secret key 256-bit chuẩn HMAC-SHA
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Thời hạn token: 24 giờ (86400000 ms)
jwt.expiration-ms=86400000
