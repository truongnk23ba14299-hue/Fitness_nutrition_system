# ===================================================================
# 1. CẤU HÌNH CỔNG CHẠY SERVER BACKEND
# ===================================================================
server.port=8080

# ===================================================================
# 2. CẤU HÌNH KẾT NỐI DATABASE POSTGRESQL
# ===================================================================
# Cổng mặc định của PostgreSQL là 5432, tên database là gym_db
spring.datasource.url=jdbc:postgresql://localhost:5432/gym_db
spring.datasource.username=postgres
# Thay bằng mật khẩu bạn đã đặt lúc cài PostgreSQL 
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# 3. CẤU HÌNH HIBERNATE (JPA)
# ===================================================================
# ddl-auto=update: Tự động tạo bảng hoặc cập nhật cột mới từ các file Model (@Entity)
spring.jpa.hibernate.ddl-auto=update

# In các câu lệnh SQL ra màn hình Console khi chạy để dễ theo dõi/debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Khai báo Dialect riêng cho PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Không tự động mở Open EntityManager in View (giúp tối ưu hiệu năng)
spring.jpa.open-in-view=false

# ===================================================================
# 4. CẤU HÌNH JWT (JSON WEB TOKEN)
# ===================================================================
app.jwt.secret=fitnessNutritionSystemSuperSecretKey2026SecureKeyWithAtLeast32Bytes
app.jwt.expiration-ms=86400000
